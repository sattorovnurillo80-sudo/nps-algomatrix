name: news
on:
  schedule: [{cron: "7 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yangiliklarni olish
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          ok = None
          for u in ["https://nfs.faireconomy.media/ff_calendar_thisweek.json", "https://cdn-nfs.faireconomy.media/ff_calendar_thisweek.json"]:
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"})
                  ok = json.load(urllib.request.urlopen(req, timeout=30)); break
              except Exception as e:
                  print("xato", u, e)
          if ok is None:
              raise SystemExit(0)
          keep = [dict(title=e["title"], country=e["country"], date=e["date"], impact=e["impact"]) for e in ok
                  if e.get("country") == "USD" and (e.get("impact") == "High" or (e.get("impact") == "Medium" and re.search("FOMC|Fed|Powell", e.get("title", ""), re.I)))]
          json.dump(keep, open("news.json", "w"), ensure_ascii=False, indent=1)
          print(len(keep), "ta yangilik")
          PY
      - name: Saqlash
        run: |
          git config user.name "nps-bot"; git config user.email "nps-bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || (git commit -m "news.json yangilandi" && git push)
